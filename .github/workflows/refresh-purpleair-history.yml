name: Refresh PurpleAir history

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: write

concurrency: purpleair-history

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch history
        env:
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        run: node scripts/fetch-purpleair-history.mjs
      - name: Commit if changed
        run: |
          git add purpleair-history.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git config user.name "tesoro-events-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh PurpleAir history"
            git pull --rebase origin main || true
            git push
          fi
