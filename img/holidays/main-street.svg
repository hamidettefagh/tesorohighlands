<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A drawing of an old-town main street at night: storefronts with lit windows, strings of lights across the street, a tall lit tree and falling snow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07102b"/><stop offset=".65" stop-color="#16306a"/><stop offset="1" stop-color="#2c4f96"/></linearGradient>
    <radialGradient id="glow" cx="400" cy="250" r="230" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".5"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <!-- far hills -->
  <path d="M0 300 Q120 250 250 285 T520 270 T800 290 V450 H0Z" fill="#0f2250"/>
  <!-- storefronts, left -->
  <g fill="#0a1533">
    <path d="M0 215 H110 V190 H150 V215 H230 V405 H0Z"/>
    <path d="M230 240 H258 L275 222 L292 240 H322 V405 H230Z"/>
    <path d="M478 240 H506 L523 222 L540 240 H570 V405 H478Z"/>
    <path d="M570 205 H650 V180 H700 V205 H800 V405 H570Z"/>
  </g>
  <!-- lit windows and doors -->
  <g fill="#ffd27a">
    <rect x="22" y="250" width="34" height="40" rx="3"/><rect x="74" y="250" width="34" height="40" rx="3"/><rect x="150" y="250" width="34" height="40" rx="3"/>
    <rect x="22" y="320" width="86" height="62" rx="4"/><rect x="140" y="322" width="52" height="83" rx="4"/>
    <rect x="252" y="270" width="48" height="36" rx="3"/><rect x="258" y="330" width="36" height="75" rx="4"/>
    <rect x="500" y="270" width="48" height="36" rx="3"/><rect x="506" y="330" width="36" height="75" rx="4"/>
    <rect x="596" y="240" width="34" height="40" rx="3"/><rect x="664" y="240" width="34" height="40" rx="3"/><rect x="738" y="240" width="34" height="40" rx="3"/>
    <rect x="600" y="320" width="52" height="85" rx="4"/><rect x="684" y="322" width="92" height="60" rx="4"/>
  </g>
  <!-- awnings -->
  <g fill="#b02a2a"><path d="M14 312 H116 L108 326 H22Z"/><path d="M676 314 H784 L776 328 H684Z"/></g>
  <g fill="#1b7a45"><path d="M246 322 H306 L300 334 H252Z"/><path d="M494 322 H554 L548 334 H500Z"/></g>
  <!-- strings of lights across the street -->
  <g fill="none" stroke="#f3e3b0" stroke-opacity=".55" stroke-width="1.5">
    <path d="M230 232 Q400 300 570 215"/><path d="M110 196 Q400 262 700 186"/>
  </g>
  <g>
    <circle cx="262" cy="244" r="5" fill="#f87171"/><circle cx="300" cy="256" r="5" fill="#4ade80"/><circle cx="340" cy="264" r="5" fill="#fde047"/><circle cx="460" cy="250" r="5" fill="#60a5fa"/><circle cx="500" cy="238" r="5" fill="#f472b6"/><circle cx="540" cy="225" r="5" fill="#4ade80"/>
    <circle cx="160" cy="206" r="5" fill="#fde047"/><circle cx="215" cy="216" r="5" fill="#60a5fa"/><circle cx="280" cy="225" r="5" fill="#f87171"/><circle cx="520" cy="220" r="5" fill="#fde047"/><circle cx="585" cy="209" r="5" fill="#f87171"/><circle cx="650" cy="196" r="5" fill="#4ade80"/>
  </g>
  <!-- the tree -->
  <rect x="390" y="372" width="20" height="34" fill="#5b3a1e"/>
  <path d="M400 150 L446 232 H424 L466 300 H440 L486 378 H314 L360 300 H334 L376 232 H354Z" fill="#14693a"/>
  <g>
    <circle cx="392" cy="212" r="6" fill="#fde047"/><circle cx="414" cy="238" r="6" fill="#f87171"/><circle cx="378" cy="268" r="6" fill="#60a5fa"/><circle cx="424" cy="284" r="6" fill="#fde047"/><circle cx="400" cy="318" r="6" fill="#f472b6"/>
    <circle cx="352" cy="338" r="6" fill="#fde047"/><circle cx="446" cy="340" r="6" fill="#60a5fa"/><circle cx="376" cy="360" r="6" fill="#f87171"/><circle cx="424" cy="362" r="6" fill="#4ade80"/><circle cx="462" cy="366" r="6" fill="#f87171"/><circle cx="336" cy="366" r="6" fill="#4ade80"/>
  </g>
  <path d="M400 118 l7 16 17 1.500 -13 11 4 17 -15 -9 -15 9 4 -17 -13 -11 17 -1.500Z" fill="#fde047"/>
  <!-- snowy street -->
  <path d="M0 400 Q200 386 400 396 T800 398 V450 H0Z" fill="#e8f0ff"/>
  <path d="M0 420 Q220 408 420 418 T800 414 V450 H0Z" fill="#cfdcf7"/>
  <!-- falling snow -->
  <g fill="#fff">
    <circle cx="60" cy="60" r="3"/><circle cx="150" cy="130" r="2.500"/><circle cx="230" cy="50" r="3.500"/><circle cx="310" cy="110" r="2.500"/><circle cx="470" cy="70" r="3"/><circle cx="560" cy="130" r="2.500"/><circle cx="640" cy="50" r="3.500"/><circle cx="730" cy="110" r="3"/>
    <circle cx="100" cy="170" r="2.500" opacity=".8"/><circle cx="350" cy="40" r="2" opacity=".8"/><circle cx="520" cy="170" r="2" opacity=".8"/><circle cx="690" cy="150" r="2.500" opacity=".8"/><circle cx="770" cy="40" r="2" opacity=".8"/><circle cx="20" cy="120" r="2" opacity=".8"/>
    <circle cx="190" cy="350" r="3" opacity=".9"/><circle cx="330" cy="420" r="0"/><circle cx="610" cy="300" r="2.500" opacity=".7"/><circle cx="460" cy="190" r="2.500" opacity=".8"/><circle cx="120" cy="300" r="2.500" opacity=".7"/>
  </g>
</svg>
